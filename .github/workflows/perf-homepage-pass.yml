name: Homepage performance optimization pass

on:
  push:
    branches:
      - perf/homepage-lighthouse-20260908

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/homepage-lighthouse-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply targeted Lighthouse fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # 1) Delay GA until browser idle time. Next.js recommends lazyOnload for
          # non-critical third-party scripts that do not need to compete with LCP/hydration.
          layout = Path('app/layout.tsx')
          text = layout.read_text()
          if text.count('strategy="afterInteractive"') < 2:
              raise SystemExit('Unexpected analytics script layout; refusing unsafe patch')
          text = text.replace('strategy="afterInteractive"', 'strategy="lazyOnload"')
          layout.write_text(text)

          # 2) Keep the Featured section but halve duplicated product-card hydration/render work.
          page = Path('app/page.tsx')
          text = page.read_text()
          if text.count(').limit(8);') != 2:
              raise SystemExit('Expected two featured .limit(8) calls; refusing unsafe patch')
          text = text.replace(').limit(8);', ').limit(4);')
          page.write_text(text)

          # 3) Right-size product images more closely to the actual 4-column desktop card width,
          # and request slightly lower quality for catalog thumbnails.
          card = Path('components/ProductCard.tsx')
          text = card.read_text()
          old_sizes = 'sizes="(max-width: 640px) calc(50vw - 24px), (max-width: 1024px) 33vw, 25vw"'
          new_sizes = 'sizes="(max-width: 640px) calc(50vw - 24px), (max-width: 1024px) 33vw, (max-width: 1280px) 25vw, 288px"'
          if old_sizes not in text:
              raise SystemExit('Expected ProductCard image sizes string not found')
          text = text.replace(old_sizes, new_sizes, 1)
          marker = 'fetchPriority={priorityImage ? \'high\' : \'auto\'} className='
          if marker not in text:
              raise SystemExit('Expected ProductCard image marker not found')
          text = text.replace(marker, 'fetchPriority={priorityImage ? \'high\' : \'auto\'} quality={70} className=', 1)
          card.write_text(text)

          # 4) Replace N per-card review requests with a shared micro-batched request.
          rating = Path('components/ProductRatingTag.tsx')
          rating.write_text(r'''\'use client\';

import { useEffect, useState } from 'react';
import Link from 'next/link';
import { Star } from 'lucide-react';
import { supabase } from '@/lib/supabase';

type RatingSummary = {
  average: number;
  count: number;
};

const summaryCache = new Map<string, RatingSummary>();
const pendingProductIds = new Set<string>();
const listeners = new Map<string, Set<(summary: RatingSummary) => void>>();
let batchScheduled = false;

function publish(productId: string, summary: RatingSummary) {
  summaryCache.set(productId, summary);
  const productListeners = listeners.get(productId);
  if (!productListeners) return;
  for (const listener of productListeners) listener(summary);
  listeners.delete(productId);
}

async function flushRatingBatch() {
  batchScheduled = false;
  const productIds = Array.from(pendingProductIds);
  pendingProductIds.clear();
  if (!productIds.length) return;

  const { data, error } = await supabase
    .from('reviews')
    .select('product_id, rating')
    .in('product_id', productIds)
    .eq('status', 'approved');

  if (error) {
    for (const productId of productIds) publish(productId, { average: 0, count: 0 });
    return;
  }

  const grouped = new Map<string, number[]>();
  for (const row of data || []) {
    const productId = String(row.product_id || '');
    const rating = Number(row.rating || 0);
    if (!productId || !rating) continue;
    const values = grouped.get(productId) || [];
    values.push(rating);
    grouped.set(productId, values);
  }

  for (const productId of productIds) {
    const values = grouped.get(productId) || [];
    const average = values.length
      ? values.reduce((sum, value) => sum + value, 0) / values.length
      : 0;
    publish(productId, { average, count: values.length });
  }
}

function requestRating(productId: string, listener: (summary: RatingSummary) => void) {
  const cached = summaryCache.get(productId);
  if (cached) {
    listener(cached);
    return () => {};
  }

  const productListeners = listeners.get(productId) || new Set();
  productListeners.add(listener);
  listeners.set(productId, productListeners);
  pendingProductIds.add(productId);

  if (!batchScheduled) {
    batchScheduled = true;
    window.setTimeout(() => void flushRatingBatch(), 0);
  }

  return () => {
    const current = listeners.get(productId);
    current?.delete(listener);
    if (current && current.size === 0) listeners.delete(productId);
  };
}

export default function ProductRatingTag({ productId }: { productId: string }) {
  const [summary, setSummary] = useState<RatingSummary>(() =>
    summaryCache.get(productId) || { average: 0, count: 0 }
  );

  useEffect(() => requestRating(productId, setSummary), [productId]);

  return (
    <Link
      href={`/product/${productId}#reviews`}
      aria-label={summary.count ? `Open ${summary.average.toFixed(1)} star product reviews` : 'Open product reviews'}
      className="inline-flex min-h-7 shrink-0 items-center gap-1 rounded-full border border-[#ead8b8] bg-[#fffaf5] px-2 py-1 text-[10px] font-black text-[#741f23] shadow-sm transition hover:border-[#d7aa5b] hover:bg-[#fff7e8] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#d7aa5b]"
    >
      <Star size={12} fill={summary.count ? 'currentColor' : 'none'} className="text-[#d7aa5b]" aria-hidden="true" />
      {summary.count ? `${summary.average.toFixed(1)} (${summary.count})` : 'No reviews'}
    </Link>
  );
}
''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified performance changes
        shell: bash
        run: |
          rm -f .github/workflows/perf-homepage-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx app/page.tsx components/ProductCard.tsx components/ProductRatingTag.tsx .github/workflows/perf-homepage-pass.yml
          git commit -m "perf: reduce homepage main-thread and network work"
          git push origin perf/homepage-lighthouse-20260908
